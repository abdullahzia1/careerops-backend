name: Deploy Backend

on:
  push:
    branches: [main]

env:
  AWS_REGION:     ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_URI }}
  ECS_CLUSTER:    ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE:    ${{ secrets.ECS_SERVICE }}
  TASK_FAMILY:    ${{ secrets.ECS_TASK_FAMILY }}

jobs:
  ci:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Build Image & Deploy
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REPOSITORY:latest .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest
          echo "image=$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query taskDefinition \
            > task-definition.json

      - name: Patch FRONTEND_ORIGIN in task definition
        run: |
          jq '(.containerDefinitions[0].environment[] | select(.name == "FRONTEND_ORIGIN")).value = "https://app.careerops.enovisoft.com"' \
            task-definition.json > task-definition.patched.json \
            && mv task-definition.patched.json task-definition.json

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  careerops-backend
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:  ${{ steps.render-task-def.outputs.task-definition }}
          service:          ${{ env.ECS_SERVICE }}
          cluster:          ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test — verify LaTeX engine is present
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://api.careerops.enovisoft.com' }}
        run: |
          set -euo pipefail
          echo "Hitting $API_BASE/api/v1/system/doctor"

          # Retry briefly to absorb post-deploy warm-up.
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$API_BASE/api/v1/system/doctor" -o doctor.json; then
              break
            fi
            echo "Doctor endpoint not ready yet (attempt $attempt) — sleeping 10s"
            sleep 10
          done

          if [ ! -s doctor.json ]; then
            echo "::error::Doctor endpoint never responded with a body."
            exit 1
          fi

          echo "Doctor response:"
          jq '.' doctor.json

          latex_pass=$(jq -r '
            (.checks // [])
            | map(select(.label | test("LaTeX engine"; "i")))
            | (.[0].pass // false)
          ' doctor.json)

          if [ "$latex_pass" != "true" ]; then
            echo "::error::LaTeX engine missing in deployed image — /api/v1/latex/compile will fail."
            echo "::error::Check careerops-backend/Dockerfile (Tectonic install step)."
            exit 1
          fi

          echo "✓ LaTeX engine detected in deployed task."
